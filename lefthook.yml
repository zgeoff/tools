# Git hooks. pre-commit fixes staged files only (fast); pre-push runs the shared
# baseline, which checks what the branch changes plus the cheap whole-tree
# gates. CI runs every whole-tree check, type-aware lint and the full suite
# among them.

# The source of the baseline that repo-sync delivers to the other repos as
# .lefthook/pre-push-baseline.yml.
extends:
  - sync/pre-push/lefthook-pre-push.yml

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Runs from source: the built bin only exists after a workspace build,
    # which fresh installs don't reliably perform.
    - name: format-codemod
      glob: '*.{ts,tsx}'
      run: bun packages/format-codemod/src/cli.ts --quiet {staged_files}
      stage_fixed: true
