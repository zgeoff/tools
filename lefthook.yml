# Git hooks. pre-commit fixes staged files only (fast); pre-push runs the shared
# baseline, which checks what the branch changes plus the cheap whole-tree
# gates. CI runs every whole-tree check, type-aware lint and the full suite
# among them.

# The baseline that @zgeoff/chex ships, which chex init writes into a repo.
extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Runs from source: the built bin only exists after a workspace build,
    # which fresh installs don't reliably perform.
    - name: format-codemod
      glob: '*.{ts,tsx}'
      run: bun packages/format-codemod/src/cli.ts --quiet {staged_files}
      stage_fixed: true

# tools' own checks, beside the baseline's pre-push jobs.
pre-push:
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: release-workflow
      glob: '.github/workflows/release-please.yml'
      run: bun run --silent check:release-workflow
    - name: repo-sync-workflows
      glob:
        - '.github/workflows/repo-sync.yml'
        - 'sync/repo-sync.yml'
      run: bun run --silent check:repo-sync-workflows
    - name: step-bundles
      glob:
        - '*.ts'
        - 'step-bundles/**'
        - 'bun.lock'
        - '.bun-version'
      run: bun run --silent check:step-bundles
