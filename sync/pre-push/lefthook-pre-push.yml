# repo-sync delivers this file from zgeoff/tools; edit it there.
#
# The pre-push baseline every zgeoff repo extends from its lefthook.yml:
#
#   extends:
#     - .lefthook/pre-push-baseline.yml
#
# It checks what the branch changes, plus the whole-tree gates that fit a
# small host: format:check and typecheck. CI runs every whole-tree check:
# type-aware lint, dead code, and the full test suite. A repo adds its own
# pre-push jobs under pre-push.jobs in lefthook.yml; they run before these.
# A repo changes what a job runs through the package script it calls, except
# check, which runs only zgeoff-check.

pre-push:
  # Sequential, to bound memory on a small host or with parallel agents.
  piped: true
  jobs:
    - name: format:check
      run: bun run format:check
    # Plain oxlint, without the unused-directive check: a directive for a
    # type-aware rule reads as unused in plain mode.
    - name: lint
      files: bun run --silent files:branch
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: bun run lint:files {files}
    # zgeoff-check picks each check's files from the list itself, so the job
    # takes every file the branch changes. It checks only that list, so a file
    # the branch leaves unchanged never fails a push. Each path gets a ./
    # prefix, so a file whose name starts with a dash reads as a file, not an
    # option. bun appends the paths to the check script's last command, and
    # only zgeoff-check is sure to take them, so the job runs only when the
    # script is zgeoff-check, and otherwise prints a notice and passes.
    - name: check
      files: bun run --silent files:branch
      run: >-
        if bun -e 'const check = require("./package.json").scripts?.check; if (check ===
        "zgeoff-check") process.exit(0); console.log(check === undefined ? "check: skipped, because
        package.json has no check script; add \"check\": \"zgeoff-check\" to run it" : `check:
        skipped, because the check script is ${JSON.stringify(check)}, not \"zgeoff-check\"`);
        process.exit(1)'; then set -- {files}; for file; do set -- "$@" "./$file"; shift; done; bun
        run check "$@"; fi
    - name: typecheck
      run: bun run typecheck
    # A pre-push in a linked worktree exports GIT_DIR, and a test that runs git
    # in a temp folder would inherit it and write to the real repository: a
    # git init there sets core.bare=true. The tests run without git's
    # repository variables.
    - name: test
      files: bun run --silent files:branch
      glob: '*.{ts,tsx}'
      run:
        env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR bun run test:related
        {files}
