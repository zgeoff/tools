[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800
# tsrs 0.18.0 and its native packages skip the guard so typecheck can move to it now; they come out
# on 2026-10-26, once tsrs 0.18.0 is 7 days old.
# fast-uri 3.1.9 and happy-dom 21.0.4 with its registrator skip the guard because each is the only
# fix for an advisory that fails `bun audit`; they come out on 2026-10-28, once both are 7 days old.
minimumReleaseAgeExcludes = [
  "@happy-dom/global-registrator",
  "fast-uri",
  "happy-dom",
  "tsrs",
  "@tsrs/darwin-arm64",
  "@tsrs/linux-arm64-gnu",
  "@tsrs/linux-arm64-musl",
  "@tsrs/linux-x64-gnu",
  "@tsrs/linux-x64-musl",
]

[test]
# register jest-extended matchers in every test file
preload = ["@zgeoff/bun-test-extended"]
