[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

[test]
# register jest-extended matchers, and start the one MSW server, in every test file
preload = ["@zgeoff/bun-test-extended", "./test-utils/mocks/listen-mock-server.ts"]
