# actionlint 1.7.12 does not know the job.workflow_* properties
# (rhysd/actionlint#757) or the queue key of concurrency. The Check workflows
# step of bun-checks.yml gives the queue ignore's reason and expiry; it repeats
# here so that a plain actionlint run in this repo passes too.
paths:
  .github/workflows/*.{yml,yaml}:
    ignore:
      - 'property "workflow_(sha|ref)" is not defined in object type \{check_run_id: '
      - 'unexpected key "queue" for "concurrency" section'
