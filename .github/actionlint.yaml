# actionlint 1.7.12 does not know the job.workflow_* properties
# (rhysd/actionlint#757). The workflows check in CI and in the pre-push
# baseline ignores the queue key of concurrency until an expiry date, so this
# config leaves that key to them.
paths:
  .github/workflows/*.{yml,yaml}:
    ignore:
      - 'property "workflow_(sha|ref)" is not defined in object type \{check_run_id: '
