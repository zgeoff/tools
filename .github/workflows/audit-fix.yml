# Reusable workflow: turns a red `bun audit` on the caller's default branch, or
# on `base-branch`, into a pull request against that branch.
# scripts/audit-fix/run-audit-fix.ts updates each vulnerable package to a fixed
# release, excludes a fix younger than the minimumReleaseAge gate in bunfig.toml
# with a dated comment, and records each advisory it cannot fix in
# audit-ignores.json with a reason and an expiry, mirrored as an --ignore flag in
# the `audit` script. An expired ignore is audited again on the next run.
#
# The job pushes the result to the branch audit-fix and opens or updates one
# pull request, labelled dependencies and security. A change that adds or renews
# an ignore is also labelled audit-ignore and waits for a person: the job turns
# auto-merge off for it, even with `automerge`. Any other change, with
# `automerge`, merges on green checks, which needs auto-merge allowed in the repo
# settings. When nothing needs a change, the job deletes the branch, which closes
# a stale pull request.
#
# The caller needs Bun 1.4.0 or newer in .bun-version, for `bun audit fix`, and
# the REPO_SYNC_APP_CLIENT_ID and REPO_SYNC_APP_PRIVATE_KEY secrets that
# repo-sync uses: a push with the default GITHUB_TOKEN starts no checks on the
# pull request. sync/workflow-callers/audit-fix.yml is the caller.
name: Audit fix (reusable)

on:
  workflow_call:
    inputs:
      expiry-days:
        description: Days an ignore lasts before the step audits its advisory again
        type: number
        required: false
        default: 30
      automerge:
        description:
          Ask GitHub to merge a pull request that adds or renews no ignore once its checks pass
        type: boolean
        required: false
        default: true
      base-branch:
        description:
          Branch to audit and to open the pull request against; empty means the default branch
        type: string
        required: false
        default: ''
    secrets:
      REPO_SYNC_APP_CLIENT_ID:
        required: true
      REPO_SYNC_APP_PRIVATE_KEY:
        required: true

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE: ${{ inputs.base-branch || github.event.repository.default_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      LEFTHOOK: 0
    steps:
      - name: Mint a write token for the caller
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the branch to audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}
          token: ${{ steps.app-token.outputs.token }}

      # The scripts live in this repo, not in the caller's checkout, so the
      # job downloads them from the commit that defines it: a caller at a sync
      # tag runs that tag's scripts. actionlint does not know
      # job.workflow_repository or job.workflow_sha, so each step reads them
      # through toJSON.
      - name: Download the step script downloader
        env: &tools-url
          TOOLS_URL:
            https://raw.githubusercontent.com/${{ fromJSON(toJSON(job)).workflow_repository }}/${{
            fromJSON(toJSON(job)).workflow_sha }}
        run:
          curl -fsSL --retry 3 --retry-all-errors --create-dirs -o "$RUNNER_TEMP/tools/.bun-version"
          "$TOOLS_URL/.bun-version" -o "$RUNNER_TEMP/tools/scripts/ci/download-step-scripts.ts"
          "$TOOLS_URL/scripts/ci/download-step-scripts.ts"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the audit-fix scripts
        env: *tools-url
        run: bun "$RUNNER_TEMP/tools/scripts/ci/download-step-scripts.ts" audit-fix

      # An open fix branch's ignores keep their expiry on a rerun, so the
      # rerun builds the same tree.
      - name: Fix the advisories
        env:
          EXPIRY_DAYS: ${{ inputs.expiry-days }}
          NO_COLOR: 1
        run: bun "$RUNNER_TEMP/tools/scripts/audit-fix/fix-advisories.ts"

      # An ignore must not ride an auto-merge armed for an earlier fix, so
      # auto-merge goes off before the push, and a rerun that makes the tree
      # the open fix holds pushes nothing.
      - name: Commit and push the fix
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun "$RUNNER_TEMP/tools/scripts/audit-fix/commit-audit-fix.ts"

      - name: Open or update the pull request
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMERGE: ${{ inputs.automerge }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun "$RUNNER_TEMP/tools/scripts/audit-fix/open-audit-fix-pull-request.ts"
