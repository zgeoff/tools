# Sends each repo that the sync App can reach a repository_dispatch event,
# zgeoff-tools-sync, with a commit on main in client_payload.sha. Each repo's
# repo-sync caller then syncs the files of that commit, as
# docs/architecture/repo-sync.md describes.
#
# A green Main push run on main sends the newest green commit when a synced
# source changed between the green commit before its own and that commit. A
# zgeoff-skills-sync event, which zgeoff/skills sends from each green main with
# its commit in client_payload.sha, opens a pull request here that moves
# sync/skills-pin.json to that commit, with auto-merge on; its merge is the
# synced change that the next green Main run sends. Each job mints the sync
# App's token from the REPO_SYNC_APP_CLIENT_ID and REPO_SYNC_APP_PRIVATE_KEY
# secrets: a dispatch needs only its contents write, and the pin pull request
# its contents and pull-requests write on this repo.
name: Sync dispatch

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [zgeoff-skills-sync]

jobs:
  dispatch:
    name: Dispatch the sync
    # The run holds an App token, so it starts only from a green push to main
    # of this repository, never from a fork's run or a republish.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No concurrency group: GitHub keeps one pending run per group and drops the
    # others, and a dropped run's range would go unchecked. A repo skips a commit
    # older than one it already pins, so the order of the dispatches is free.
    permissions:
      contents: read
      actions: read
    steps:
      # The plan diffs main between two green commits and reads the manifest of
      # each.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Plan the dispatch
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run --silent ci:plan-sync-dispatch

      - name: Mint the sync App token
        if: ${{ steps.plan.outputs.send == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Send the dispatch to each repo
        if: ${{ steps.plan.outputs.send == 'true' }}
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run --silent ci:send-sync-dispatches

  skills-pin:
    name: Move the zgeoff/skills pin
    # Only a token with write access to this repo can send the event, and the
    # step moves the pin only to a commit on main of zgeoff/skills.
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each run rewrites the one pin branch. GitHub drops a waiting run that a
    # newer one replaces, and the newer commit covers the dropped one.
    concurrency:
      group: skills-pin
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Mint the sync App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pin pull request
        env:
          SKILLS_COMMIT: ${{ github.event.client_payload.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run --silent ci:write-skills-pin-pull-request
