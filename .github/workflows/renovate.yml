# Runs self-hosted Renovate over every repository where the Renovate GitHub App
# is installed. The shared preset in default.json needs a self-hosted run: its
# postUpgradeTasks refresh bun.lock with `bun install`, and only the admin's
# allowedCommands lets Renovate run that command.
#
# A repository opts in with a renovate.json that extends the preset; one with
# no config is skipped, and gets no onboarding pull request. The run every two
# hours lands inside the preset's Monday 00:00-05:59 UTC window, so the weekly
# groups and lock-file maintenance open on schedule.
#
# The job mints an installation token from the RENOVATE_APP_ID secret, which
# holds the App's client ID, and the RENOVATE_APP_PRIVATE_KEY secret. Renovate
# commits as the App's bot user, so the commits match the token that pushes
# them.
name: Renovate

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan the updates without pushing a branch or opening a pull request
        type: choice
        options: ['off', lookup, full]
        default: 'off'
      log-level:
        description: Renovate's log level
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mint a token for the App's installation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve the App's bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "username=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "git-author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.149.0
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: ${{ steps.bot.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
          RENOVATE_ALLOWED_COMMANDS: '["^bun install --ignore-scripts( --minimum-release-age=0)?$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dry-run != 'off' && inputs.dry-run || '' }}
