name: PR

on:
  # Every base, as the synced caller does, so each pull request of a stack
  # gets its checks before the one below it merges.
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/bun-checks.yml
    with:
      scripts:
        check:sync check:release-workflow check:repo-sync-workflows check:step-bundles format:check
        lint:full typecheck test test:browser test:e2e test:host
      # oxlint runs its JS plugin under Node, which reads rig.config.ts and
      # strips its types from Node 22.18.
      node-version: 24
      # The tests of the check steps and the pre-push jobs run shfmt and
      # actionlint, in the test job, which runs no check step.
      setup-shfmt: true
      setup-actionlint: true

  # Validates the shared Renovate preset as a repo config, which is how each
  # repo's renovate.json loads it. The validator takes its version from
  # renovate.yml's renovate-version, so the check reads the preset as the
  # scheduled run does.
  # The check also fails when the preset's first-party rule and the
  # dependency-gates check's first-party scopes differ.
  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Validate default.json
        run: bun run --silent check:renovate-config
