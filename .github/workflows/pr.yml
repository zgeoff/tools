name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/bun-checks.yml
    with:
      scripts: check:sync format:check lint:full typecheck test test:workflows check
      # The @zgeoff/checks tests and the check script run shfmt.
      setup-shfmt: true
