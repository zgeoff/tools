# Reusable workflow: the pull-request checks every zgeoff Bun repo runs. A
# gitleaks job scans the commits, and a checks job installs with the frozen
# lockfile, then runs each package script in `scripts` in order.
#
# `scripts` is a space-separated list of package.json script names. Empty means
# the standard list: audit deadcode format:check lint check typecheck test,
# where check runs only when the repo defines it. Any other name the repo's
# package.json does not define fails the run before any script runs, so a
# renamed script cannot drop a check without notice. The synced
# caller passes the BUN_CHECK_SCRIPTS and NODE_VERSION repo variables, so a
# repo changes the list or adds Node without editing the caller.
name: Bun checks (reusable)

on:
  workflow_call:
    inputs:
      scripts:
        description: Space-separated package scripts to run in order; empty runs the standard list
        type: string
        required: false
        default: ''
      node-version:
        description: Node version to set up next to Bun; empty sets up none
        type: string
        required: false
        default: ''
      gitleaks:
        description: Scan the commits for secrets
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: Timeout for the checks job
        type: number
        required: false
        default: 10
      setup-shfmt:
        description:
          Install shfmt even when the scripts do not run check, for a suite whose tests run it
        type: boolean
        required: false
        default: false

jobs:
  gitleaks:
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action comments findings on the PR, which needs write on pull-requests.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) predates the root-level [[allowlists]]
          # syntax and silently ignores it.
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      # CI never commits; skip hook install and execution.
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: inputs.node-version != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # Picks the scripts before anything runs, so a missing name fails fast
      # and the shfmt setup knows whether check runs.
      - name: Pick the check scripts
        id: pick
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          # A value of only whitespace parses to no names and gets the standard list too.
          read -ra list <<< "$SCRIPTS"
          if [ "${#list[@]}" -eq 0 ]; then
            list=(audit deadcode format:check lint)
            # The standard list runs check only when the repo defines it, so a
            # repo turns the check on by adding the script.
            if jq -e '.scripts.check' package.json > /dev/null; then
              list+=(check)
            else
              echo '::notice::check skipped, because package.json has no check script; add "check": "zgeoff-check" to run it.'
            fi
            list+=(typecheck test)
          fi
          missing=""
          for name in "${list[@]}"; do
            jq -e --arg name "$name" '.scripts[$name]' package.json > /dev/null || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::package.json defines no script named:$missing. Pass the scripts input, or set the BUN_CHECK_SCRIPTS repo variable, to change the list."
            exit 1
          fi
          # Spaces around the list let a step match one whole name.
          echo "scripts= ${list[*]} " >> "$GITHUB_OUTPUT"

      # The shell check of zgeoff-check runs shellcheck, which the runner image
      # carries, and shfmt, which it lacks. The step installs the pinned binary
      # when check runs or the caller asks for it, into a folder the runner
      # owns, put on the PATH of the later steps.
      - name: Setup shfmt
        env:
          SCRIPTS: ${{ steps.pick.outputs.scripts }}
          SETUP_SHFMT: ${{ inputs.setup-shfmt }}
          SHFMT_VERSION: v3.13.1
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        run: |
          set -euo pipefail
          if [ "$SETUP_SHFMT" != true ] && [[ "$SCRIPTS" != *" check "* ]]; then
            echo "shfmt: not needed, because the scripts do not run check"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/shfmt.download" "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $RUNNER_TEMP/shfmt.download" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shfmt-bin"
          install -m 0755 "$RUNNER_TEMP/shfmt.download" "$RUNNER_TEMP/shfmt-bin/shfmt"
          echo "$RUNNER_TEMP/shfmt-bin" >> "$GITHUB_PATH"

      - name: Run the check scripts
        env:
          SCRIPTS: ${{ steps.pick.outputs.scripts }}
        run: |
          set -euo pipefail
          read -ra list <<< "$SCRIPTS"
          for name in "${list[@]}"; do
            echo "::group::bun run $name"
            bun run "$name"
            echo "::endgroup::"
          done
