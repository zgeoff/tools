# Reusable workflow: the pull-request checks every zgeoff Bun repo runs. A
# gitleaks job scans the commits, and a checks job installs with the frozen
# lockfile, fails on a hand-edited AGENTS.md when the repo builds one through
# repo-sync, then runs each package script in `scripts` in order.
#
# `scripts` is a space-separated list of package.json script names. Empty means
# the standard list: audit deadcode format:check lint typecheck test. A name
# the repo's package.json does not define fails the run before any script
# runs, so a renamed script cannot drop a check without notice. The synced
# caller passes the BUN_CHECK_SCRIPTS and NODE_VERSION repo variables, so a
# repo changes the list or adds Node without editing the caller.
name: Bun checks (reusable)

on:
  workflow_call:
    inputs:
      scripts:
        description: Space-separated package scripts to run in order; empty runs the standard list
        type: string
        required: false
        default: ''
      node-version:
        description: Node version to set up next to Bun; empty sets up none
        type: string
        required: false
        default: ''
      gitleaks:
        description: Scan the commits for secrets
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: Timeout for the checks job
        type: number
        required: false
        default: 10

jobs:
  gitleaks:
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action comments findings on the PR, which needs write on pull-requests.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) predates the root-level [[allowlists]]
          # syntax and silently ignores it.
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      # CI never commits; skip hook install and execution.
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        if: inputs.node-version != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md drift
        if: hashFiles('scripts/build-agents-md.sh') != ''
        run: |
          bash scripts/build-agents-md.sh agents/shared.md agents/project.md AGENTS.md
          git diff --exit-code AGENTS.md

      - name: Run the check scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          scripts="${SCRIPTS:-audit deadcode format:check lint typecheck test}"
          missing=""
          for name in $scripts; do
            jq -e --arg name "$name" '.scripts[$name]' package.json > /dev/null || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::package.json defines no script named:$missing. Pass the scripts input, or set the BUN_CHECK_SCRIPTS repo variable, to change the list."
            exit 1
          fi
          for name in $scripts; do
            echo "::group::bun run $name"
            bun run "$name"
            echo "::endgroup::"
          done
