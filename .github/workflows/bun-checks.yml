# Reusable workflow: the pull-request checks every zgeoff Bun repo runs, in
# one of two profiles that the calling repo's visibility picks. A public repo
# runs for wall time: a gitleaks job, a static job for every check that is not
# a test, a test job, and a test-<lane> job for each lane, at most 8 jobs. A
# private repo runs for minutes: one checks job that holds the scan, the static
# checks, the tests and each lane as named steps, because each job bills at
# least a full minute there. Every job installs with the frozen lockfile and no
# install cache.
#
# The checks job is the one check a caller requires, in either profile. In a
# public repo it runs after the other jobs and fails when one of them failed or
# was cancelled, because GitHub counts a skipped required check as a pass.
#
# The static job, and the checks job in a private repo, run the shared checks
# as named steps beside the scripts: shell, docs, workflows, commits and local
# paths. A check that needs a tool the repo lacks prints a notice and passes.
#
# `scripts` is a space-separated list of package.json script names. Empty means
# the standard list: audit deadcode format:check lint typecheck test, then each
# lane script the repo defines. A lane script is test:e2e, test:browser, test:docker or
# test:host; test and any other test:<name> run with the tests, and every other
# script runs with the static checks, each group in the list's order. Any name
# the repo's package.json does not define fails the run before any script
# runs, so a renamed script cannot drop a check without notice. The synced
# caller passes the BUN_CHECK_SCRIPTS, NODE_VERSION and
# BUN_CHECK_TIMEOUT_MINUTES repo variables, so a repo changes the list, adds
# Node or sets the jobs' time limit without editing the caller.
#
# The profile comes from github.event.repository.private, which in a reusable
# workflow reads the caller's event. The private input is the fallback for an
# event whose payload has no repository.
name: Bun checks (reusable)

on:
  workflow_call:
    inputs:
      scripts:
        description: Space-separated package scripts to run in order; empty runs the standard list
        type: string
        required: false
        default: ''
      node-version:
        description: Node version to set up next to Bun; empty sets up none
        type: string
        required: false
        default: ''
      gitleaks:
        description: Scan the commits for secrets
        type: boolean
        required: false
        default: true
      timeout-minutes:
        # The same limit as the synced caller's fallback, for a caller that
        # passes none.
        description: Timeout for each job that installs and runs scripts, in minutes
        type: number
        required: false
        default: 20
      private:
        description:
          Run the private profile when the event payload has no repository; ignored otherwise
        type: boolean
        required: false
        default: false
      setup-shfmt:
        description: Install shfmt in the test jobs too, for a suite whose tests run it
        type: boolean
        required: false
        default: false
      setup-actionlint:
        description: Install actionlint in the test jobs too, for a suite whose tests run it
        type: boolean
        required: false
        default: false

jobs:
  # Public profile.
  gitleaks:
    if:
      ${{ inputs.gitleaks && !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action comments findings on the PR, which needs write on pull-requests.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The scan reads every commit of the pull request, and the commits and
      # local paths checks read the base branch and every commit since it; a
      # shallow clone has neither. The clone is blobless, so it skips the file
      # contents of older commits, and git fetches one when a reader needs it.
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: &full-history
          fetch-depth: 0
          filter: blob:none

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) predates the root-level [[allowlists]]
          # syntax and silently ignores it.
          GITLEAKS_VERSION: 8.30.1

  # Lists the lanes for the test-<lane> jobs, so a repo without lanes starts
  # none. It checks out package.json and .bun-version alone.
  plan:
    if:
      ${{ !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PART: all
      LANE: ''
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            package.json
            .bun-version
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - &setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: &bun-version
          bun-version-file: .bun-version

      # The planner and the branch check scripts live in this repo, not in the
      # caller's checkout, so the step downloads them from the commit that
      # defines this job: a caller at a sync tag runs that tag's scripts.
      # actionlint does not know job.workflow_repository or job.workflow_sha,
      # so the step reads them from the job context as JSON.
      - &fetch-planner
        name: Fetch the check scripts
        env: &job-context
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: &fetch-body |
          set -euo pipefail
          repository=$(jq -er .workflow_repository <<< "$JOB_CONTEXT")
          sha=$(jq -er .workflow_sha <<< "$JOB_CONTEXT")
          mkdir -p "$RUNNER_TEMP/check-plan"
          base="https://raw.githubusercontent.com/$repository/$sha"
          for file in plan-check-scripts.ts write-check-plan.ts; do
            curl -fsSL -o "$RUNNER_TEMP/check-plan/$file" "$base/.github/workflows/$file"
          done
          for file in read-branch-base.ts parse-added-lines.ts run-program.ts run-commits-check.ts run-local-paths-check.ts run-test-timeouts-check.ts; do
            curl -fsSL -o "$RUNNER_TEMP/check-plan/$file" "$base/sync/pre-push/$file"
          done
          curl -fsSL -o "$RUNNER_TEMP/check-plan/tools-package.json" "$base/package.json"

      # The adapter imports ts-pattern, which the caller's checkout need not
      # hold. The step installs the version tools' catalog pins, beside the
      # planner, from the package.json the fetch downloaded.
      - &install-planner
        name: Install the check planner
        run: &install-planner-body |
          set -euo pipefail
          cd "$RUNNER_TEMP/check-plan"
          jq '{dependencies: {"ts-pattern": (.workspaces.catalog["ts-pattern"] // error("tools pins no ts-pattern"))}}' tools-package.json > package.json
          bun install

      - &plan
        name: Plan the check scripts
        id: plan
        env: &plan-env
          SCRIPTS: ${{ inputs.scripts }}
        run: &plan-body bun "$RUNNER_TEMP/check-plan/write-check-plan.ts"

  static:
    if:
      ${{ !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      # CI never commits; skip hook install and execution.
      LEFTHOOK: 0
      PART: static
      LANE: ''
    steps:
      - *checkout

      - &setup-node
        name: Setup Node
        if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: &node-version
          node-version: ${{ inputs.node-version }}

      - *setup-bun

      # Bun installs from the registry, with no cache of ~/.bun/install/cache.
      # A restore of that cache takes longer than the install it replaces, and
      # a job that misses it spends more time to save a new one.
      - &install
        name: Install
        run: &install-body bun install --frozen-lockfile

      - *fetch-planner
      - *install-planner
      - *plan

      # The shell check runs shellcheck, which the runner image carries, and
      # shfmt, which it lacks. The step installs the pinned binary in a job
      # that runs the shell check, or when the caller asks for it, into a
      # folder the runner owns, put on the PATH of the later steps.
      - &setup-shfmt
        name: Setup shfmt
        env: &shfmt-env
          SETUP_SHFMT: ${{ inputs.setup-shfmt }}
          SHFMT_VERSION: v3.13.1
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        run: &shfmt-body |
          set -euo pipefail
          if [ "$SETUP_SHFMT" != true ] && [ "$PART" != static ] && [ "$PART" != all ]; then
            echo "shfmt: not needed, because this job runs no shell check"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/shfmt.download" "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $RUNNER_TEMP/shfmt.download" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shfmt-bin"
          install -m 0755 "$RUNNER_TEMP/shfmt.download" "$RUNNER_TEMP/shfmt-bin/shfmt"
          echo "$RUNNER_TEMP/shfmt-bin" >> "$GITHUB_PATH"

      # The workflows check runs actionlint, which the runner image lacks. The
      # step installs the pinned release the same way as shfmt.
      - &setup-actionlint
        name: Setup actionlint
        id: setup-actionlint
        env: &actionlint-env
          SETUP_ACTIONLINT: ${{ inputs.setup-actionlint }}
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: &actionlint-body |
          set -euo pipefail
          if [ "$SETUP_ACTIONLINT" != true ] && [ "$PART" != static ] && [ "$PART" != all ]; then
            echo "actionlint: not needed, because this job runs no workflows check"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      # Each check and script step after the setup runs even when an earlier
      # one fails, so the run shows every check that fails, each by name.
      - &check-shell
        name: Check shell
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: |
          set -euo pipefail
          list=$(mktemp)
          git ls-files -z -- '*.sh' > "$list"
          if [ ! -s "$list" ]; then
            echo "shell: the repo tracks no shell script"
            exit 0
          fi
          status=0
          xargs -0 -a "$list" shellcheck --external-sources --source-path=SCRIPTDIR "--source-path=$PWD" -- || status=1
          xargs -0 -a "$list" shfmt -d -- || status=1
          exit "$status"

      # The docs-writing skill's scripts pick the docs they read themselves.
      - &check-docs
        name: Check docs
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: |
          set -euo pipefail
          scripts=.claude/skills/docs-writing/scripts
          if [ ! -f "$scripts/check-length.sh" ]; then
            echo "::notice::docs: skipped, because the repo has no $scripts/check-length.sh; take the skill-docs-writing entry of repo-sync to run it"
            exit 0
          fi
          status=0
          bash "$scripts/check-length.sh" || status=1
          bash "$scripts/check-links.sh" || status=1
          exit "$status"

      - &check-workflows
        name: Check workflows
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: actionlint

      - &check-commits
        name: Check commits
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: bun "$RUNNER_TEMP/check-plan/run-commits-check.ts"

      - &check-local-paths
        name: Check local paths
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: bun "$RUNNER_TEMP/check-plan/run-local-paths-check.ts"

      - &check-test-timeouts
        name: Check test timeouts
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        run: bun "$RUNNER_TEMP/check-plan/run-test-timeouts-check.ts"

      - &run-scripts
        name: Run the check scripts
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        env:
          SCRIPTS: ${{ steps.plan.outputs.scripts }}
        run: &run-body |
          set -euo pipefail
          read -ra list <<< "$SCRIPTS"
          for name in "${list[@]}"; do
            echo "::group::bun run $name"
            bun run "$name"
            echo "::endgroup::"
          done

  test:
    if:
      ${{ !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      LEFTHOOK: 0
      PART: test
      LANE: ''
    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *install
      - *fetch-planner
      - *install-planner
      - *plan
      - *setup-shfmt
      - *setup-actionlint
      - *run-scripts

  test-lane:
    name: test-${{ matrix.lane }}
    needs: plan
    if:
      ${{ !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) && needs.plan.outputs.lanes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    env:
      LEFTHOOK: 0
      PART: lane
      LANE: ${{ matrix.lane }}
    steps:
      - *checkout
      - *setup-node
      - *setup-bun
      - *install
      - *fetch-planner
      - *install-planner
      - *plan
      - *setup-shfmt
      - *setup-actionlint
      - *run-scripts

  # The one check a caller requires, in either profile. In a private repo it
  # is the profile's single job: the public jobs it needs skip, so it starts
  # at once and runs every step but the last. In a public repo it starts after
  # every other job ends and runs only its last step, which fails when one of
  # them failed or was cancelled; a job skipped by design, such as the lane
  # job of a repo without lanes, passes. In a public repo it runs on a cancel
  # too, because GitHub counts a skipped required check as a pass.
  checks:
    needs: [gitleaks, plan, static, test, test-lane]
    if:
      ${{ !cancelled() || !((github.event.repository && github.event.repository.private) ||
      (!github.event.repository && inputs.private)) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The scan comments findings on the PR, which needs write on pull-requests.
    permissions:
      contents: read
      pull-requests: write
    env:
      LEFTHOOK: 0
      PART: all
      LANE: ''
      PROFILE:
        ${{ ((github.event.repository && github.event.repository.private) ||
        (!github.event.repository && inputs.private)) && 'private' || 'public' }}
    steps:
      - name: Checkout
        if: env.PROFILE == 'private'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *full-history

      - name: Gitleaks
        if: env.PROFILE == 'private' && inputs.gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) predates the root-level [[allowlists]]
          # syntax and silently ignores it.
          GITLEAKS_VERSION: 8.30.1

      - name: Setup Node
        if: env.PROFILE == 'private' && inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: *node-version

      - name: Setup Bun
        if: env.PROFILE == 'private'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: *bun-version

      - name: Install
        if: env.PROFILE == 'private'
        run: *install-body

      - name: Fetch the check scripts
        if: env.PROFILE == 'private'
        env: *job-context
        run: *fetch-body

      - name: Install the check planner
        if: env.PROFILE == 'private'
        run: *install-planner-body

      - name: Plan the check scripts
        id: plan
        if: env.PROFILE == 'private'
        env: *plan-env
        run: *plan-body

      - name: Setup shfmt
        if: env.PROFILE == 'private'
        env: *shfmt-env
        run: *shfmt-body

      # Each step after this one runs only when it succeeds, so in a public
      # repo, where it skips, they skip too.
      - name: Setup actionlint
        id: setup-actionlint
        if: env.PROFILE == 'private'
        env: *actionlint-env
        run: *actionlint-body

      - *check-shell
      - *check-docs
      - *check-workflows
      - *check-commits
      - *check-local-paths
      - *check-test-timeouts

      - name: Static checks
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        env:
          SCRIPTS: ${{ steps.plan.outputs.static }}
        run: *run-body

      - name: Tests
        if: ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' }}
        env:
          SCRIPTS: ${{ steps.plan.outputs.test }}
        run: *run-body

      - name: Lane e2e
        if:
          ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' &&
          contains(steps.plan.outputs.lanes, '"e2e"') }}
        env:
          SCRIPTS: test:e2e
        run: *run-body

      - name: Lane browser
        if:
          ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' &&
          contains(steps.plan.outputs.lanes, '"browser"') }}
        env:
          SCRIPTS: test:browser
        run: *run-body

      - name: Lane docker
        if:
          ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' &&
          contains(steps.plan.outputs.lanes, '"docker"') }}
        env:
          SCRIPTS: test:docker
        run: *run-body

      - name: Lane host
        if:
          ${{ !cancelled() && steps.setup-actionlint.outcome == 'success' &&
          contains(steps.plan.outputs.lanes, '"host"') }}
        env:
          SCRIPTS: test:host
        run: *run-body

      # Every other step skips in a public repo, and this one runs even after a
      # cancel, so the check fails rather than ending cancelled or skipped.
      - name: Require every job
        if: ${{ always() && env.PROFILE == 'public' }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while read -r line; do
              echo "::error::$line"
            done <<< "$failed"
            exit 1
          fi
          echo "every job passed or skipped by design"
