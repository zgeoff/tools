# Reusable workflow: checks a pull request's description against the PR
# template, and ticks or unticks its chex box.
#
# The pr-body job runs chex pr-body on the body that the API holds now, so a
# body that another job edited since the event is the one checked. The
# tick-chex job runs the docs checks that the box stands for on the pull
# request's head, then ticks the box when they pass and unticks it when they
# fail. It runs on a new or reopened pull request and on a push only, so its
# own edit of the body cannot start it again, and never on a fork, whose token
# cannot write, nor on a bot's pull request.
#
# The body, the title and the commits reach a step through env: alone, never
# through an expression in run:, so a crafted body cannot inject a command.
#
# Callers install sync/src/workflow-callers/pr-body.yml, which grants
# contents: read and pull-requests: write.
name: PR body check (reusable)

on:
  workflow_call:

# The chex release that every chex step runs from npm. Renovate bumps it.
env:
  CHEX: '@zgeoff/chex@0.4.2'

jobs:
  pr-body:
    # A bot's PR body comes from its own template.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The full history, so the check reads the commits between the base and
      # the head.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Read the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -j '.body // ""' > "$RUNNER_TEMP/pr-body.md"

      - name: Check the PR body
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run:
          bun x "$CHEX" pr-body --body-file "$RUNNER_TEMP/pr-body.md" --base "$BASE_SHA" --head
          "$HEAD_SHA"

  tick-chex:
    if:
      ${{ github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The result decides the box, so a failure here still reaches the tick
      # step. The last step fails the job again.
      - name: Check docs
        id: docs
        continue-on-error: true
        run: bun x "$CHEX" prose links skill

      # The body is read again here, because the first job and the author may
      # have changed it since the event. The write happens only on a change.
      - name: Tick the chex box
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICK_FLAG: ${{ steps.docs.outcome == 'success' && '--passed' || '--failed' }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -j '.body // ""' > "$RUNNER_TEMP/body-before.md"
          bun x "$CHEX" pr-body tick-chex --body-file "$RUNNER_TEMP/body-before.md" "$TICK_FLAG" > "$RUNNER_TEMP/body-after.md"
          if ! cmp -s "$RUNNER_TEMP/body-before.md" "$RUNNER_TEMP/body-after.md"; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/body-after.md"
          fi

      - name: Fail on a docs check
        if: ${{ steps.docs.outcome == 'failure' }}
        run: |
          echo "The docs checks failed, so the chex box is unticked. Fix what the Check docs step lists." >&2
          exit 1
