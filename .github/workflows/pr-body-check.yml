# Reusable workflow: checks a pull request's description against the PR
# template, and ticks or unticks its chex box.
#
# The pr-body job runs chex pr-body on the body that the API holds now, so a
# body that another job edited since the event is the one checked. The
# tick-chex job runs the docs checks that the box stands for on the pull
# request's head, then ticks the box when they pass and unticks it when they
# fail. It runs on a new or reopened pull request and on a push only, so its
# own edit of the body cannot start it again, and never on a fork, whose token
# cannot write, nor on a bot's pull request.
#
# Each step script downloads from the commit of this workflow, and reads the
# body through env: alone, never through an expression in run:, so a crafted
# body cannot inject a command.
#
# Callers install sync/src/workflow-callers/pr-body.yml, which grants
# contents: read and pull-requests: write.
name: PR body check (reusable)

on:
  workflow_call:

# The chex release that every chex step runs from npm. Renovate bumps it.
env:
  CHEX: '@zgeoff/chex@0.4.3'

jobs:
  pr-body:
    # A bot's PR body comes from its own template.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The full history, so the check reads the commits between the base and
      # the head.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # actionlint does not know job.workflow_repository or job.workflow_sha,
      # so the step reads them through toJSON.
      - name: Download the step script downloader
        env: &tools-url
          TOOLS_URL:
            https://raw.githubusercontent.com/${{ fromJSON(toJSON(job)).workflow_repository }}/${{
            fromJSON(toJSON(job)).workflow_sha }}
        run:
          curl -fsSL --retry 3 --retry-all-errors --create-dirs -o "$RUNNER_TEMP/tools/.bun-version"
          "$TOOLS_URL/.bun-version" -o "$RUNNER_TEMP/tools/scripts/src/ci/download-step-scripts.ts"
          "$TOOLS_URL/scripts/src/ci/download-step-scripts.ts"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ runner.temp }}/tools/.bun-version

      - name: Download the step scripts
        env: *tools-url
        run: bun "$RUNNER_TEMP/tools/scripts/src/ci/download-step-scripts.ts" pr-body-check

      - name: Check the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$RUNNER_TEMP/tools/scripts/src/pr-checks/check-pr-body.sh"

  tick-chex:
    if:
      ${{ github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The full history, so the docs check finds the merge base with the base
      # branch and reads the paragraphs that the pull request changed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download the step script downloader
        env: *tools-url
        run:
          curl -fsSL --retry 3 --retry-all-errors --create-dirs -o "$RUNNER_TEMP/tools/.bun-version"
          "$TOOLS_URL/.bun-version" -o "$RUNNER_TEMP/tools/scripts/src/ci/download-step-scripts.ts"
          "$TOOLS_URL/scripts/src/ci/download-step-scripts.ts"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ runner.temp }}/tools/.bun-version

      - name: Download the step scripts
        env: *tools-url
        run: bun "$RUNNER_TEMP/tools/scripts/src/ci/download-step-scripts.ts" pr-body-check

      # The result decides the box, so a failure here still reaches the tick
      # step, which fails the job again.
      - name: Check docs
        id: docs
        continue-on-error: true
        run: bun x "$CHEX" prose links skill

      - name: Tick the chex box
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: bash "$RUNNER_TEMP/tools/scripts/src/pr-checks/tick-chex-box.sh"
