name: OOM loop

on:
  push:
    branches: [fix-diet-oom-test-flake]

concurrency:
  group: oom-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bash scripts/ci/oom-loop.sh "$SIDE"
        env:
          SIDE: ${{ matrix.side }}
