name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    # The tick job edits the body.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-body-check.yml
