# Reusable workflow: the path gate for a workflow that runs on every pull
# request, so its jobs can be required checks. A workflow that
# on.pull_request.paths skips never reports, and blocks the merge; a job that
# its `if:` skips reports success. A caller runs this workflow as a `changes`
# job and gates each later job on its output:
#
#   needs: changes
#   if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
#
# Only a 'false' skips the job, so a failed gate runs the work rather than
# pass it. On any event other than pull_request the output is 'true', so a
# push to main runs every job in full.
name: Paths changed (reusable)

on:
  workflow_call:
    inputs:
      paths:
        description:
          Path patterns, one per line, as in on.pull_request.paths; `*` and `**` both match across
          `/`
        type: string
        required: true
    outputs:
      changed:
        description:
          "'true' when the pull request changes a file that matches a pattern or the event is not a
          pull request, else 'false'"
        value: ${{ jobs.changes.outputs.changed }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.match.outputs.changed }}
    steps:
      # The merge commit and its parents are enough for the diff, and the diff
      # reads file names only, so the clone skips the base's file contents.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false

      - name: Match changed files
        id: match
        env:
          EVENT: ${{ github.event_name }}
          PATTERNS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          if [[ $EVENT != pull_request ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The merge commit against the base it merges into: what the merge
          # changes. --no-renames lists a moved file's old path too, and -z
          # leaves a path unquoted whatever its characters. A file, not a
          # process substitution, so a failed diff fails the step.
          git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          changed=false
          while IFS= read -r -d '' file; do
            while IFS= read -r pattern; do
              # shellcheck disable=SC2053 # the pattern is a glob on purpose
              if [[ -n $pattern && $file == $pattern ]]; then
                echo "$file matches $pattern"
                changed=true
              fi
            done <<< "$PATTERNS"
          done < "$RUNNER_TEMP/changed-files"
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"
