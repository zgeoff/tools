# Reusable workflow: the path gate for a workflow that runs on every pull
# request, so its jobs can be required checks. A workflow that
# on.pull_request.paths skips never reports, and blocks the merge; a job that
# its `if:` skips reports success. A caller runs this workflow as a `changes`
# job and gates each later job on its output:
#
#   needs: changes
#   if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
#
# Only a 'false' skips the job, so a failed gate runs the work rather than
# pass it. On any event other than pull_request the output is 'true', so a
# push to main runs every job in full.
name: Paths changed (reusable)

on:
  workflow_call:
    inputs:
      paths:
        description:
          Path patterns, one per line, as in on.pull_request.paths; `*` and `**` both match across
          `/`
        type: string
        required: true
    outputs:
      changed:
        description:
          "'true' when the pull request changes a file that matches a pattern or the event is not a
          pull request, else 'false'"
        value: ${{ jobs.changes.outputs.changed }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.match.outputs.changed }}
    steps:
      # The merge commit and its parents are enough for the diff, and the diff
      # reads file names only, so the clone skips the base's file contents.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false

      # actionlint does not know job.workflow_repository or job.workflow_sha,
      # so the step reads them through toJSON. The job sets up the Bun that
      # tools pins, because the caller's checkout comes only on a pull request.
      - name: Download the step script downloader
        env: &tools-url
          TOOLS_URL:
            https://raw.githubusercontent.com/${{ fromJSON(toJSON(job)).workflow_repository }}/${{
            fromJSON(toJSON(job)).workflow_sha }}
        run:
          curl -fsSL --retry 3 --retry-all-errors --create-dirs -o "$RUNNER_TEMP/tools/.bun-version"
          "$TOOLS_URL/.bun-version" -o "$RUNNER_TEMP/tools/scripts/ci/download-step-scripts.ts"
          "$TOOLS_URL/scripts/ci/download-step-scripts.ts"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ runner.temp }}/tools/.bun-version

      # Bun reads bunfig.toml, and its preloads, from its working folder. The
      # gate decides which checks a pull request runs, so no Bun command runs
      # in the pull request's checkout: each runs in the downloaded folder, and
      # the match reads the checkout through git.
      - name: Download the match script
        working-directory: ${{ runner.temp }}/tools
        env: *tools-url
        run: bun "$RUNNER_TEMP/tools/scripts/ci/download-step-scripts.ts" paths-changed

      - name: Match changed files
        id: match
        working-directory: ${{ runner.temp }}/tools
        env:
          EVENT: ${{ github.event_name }}
          PATTERNS: ${{ inputs.paths }}
        run: bun "$RUNNER_TEMP/tools/scripts/paths-changed/match-changed-files.ts"
