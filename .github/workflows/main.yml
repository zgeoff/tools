name: Main

on:
  push:
    branches: [main]
  # The publish run, which a push run dispatches at the release tag, and the
  # recovery path for a release that tagged but failed to publish: it skips
  # the release job and publishes the given package dirs after the checks
  # pass. Already-published versions are skipped, so listing extra paths is
  # safe.
  workflow_dispatch:
    inputs:
      republish_paths:
        description: 'JSON array of package dirs to republish, e.g. ["packages/format-codemod"]'
        required: true
        type: string
      released_versions:
        description:
          'JSON object of the version the release tagged for each dir, e.g.
          {"packages/std":"0.4.0"}; empty skips the check'
        required: false
        type: string
        default: ''

jobs:
  # A newer push cancels the checks of an older one.
  checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: main-checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      PART: all
    steps: &check-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # oxlint runs its JS plugin under Node, which reads rig.config.ts and
      # strips its types from Node 22.18.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The tests of the check steps and the pre-push jobs run shfmt and
      # actionlint, which the runner image lacks. The script holds the pins
      # that bun-checks.yml installs too.
      - name: Setup shfmt
        run: bun run --silent ci:install-tool shfmt
      - name: Setup actionlint
        run: bun run --silent ci:install-tool actionlint
      - run: bun run check:sync
      - run: bun run check:release-workflow
      - run: bun run check:repo-sync-workflows
      - run: bun run check:step-bundles
      - run: bun run check:lefthook-guard
      - run: bun run format:check
      - run: bun run lint:full
      - run: bun run typecheck
      - run: bun run test
      # The browser lane drives the Chrome that the ubuntu-latest image holds.
      - run: bun run test:browser
      - run: bun run test:e2e
      - run: bun run test:host

  # The same checks gate a dispatched publish run. The run ID gives each
  # dispatch a group of its own, so no push and no other dispatch cancels the
  # checks that its publish waits for.
  release-checks:
    name: Check the release before publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: main-release-checks-${{ github.run_id }}
      cancel-in-progress: false
    env:
      PART: all
    steps: *check-steps

  # A release takes two runs:
  # - Run 1, after a releasable commit lands on main: the shared
  #   release-please job opens or updates the release PR (version bumps +
  #   changelogs), makes it pass the checks job, merges it, and tags the
  #   merge (release-please.yml). The dispatch job then starts run 2.
  # - Run 2, dispatched at the tag: the publish job ships each released
  #   package to npm via OIDC, after the checks of the tagged commit pass.
  # The release job waits for no checks job: the release PR passed its own
  # checks, and the push of a release PR's merge must reach the tag while
  # the merge commit is still main's head. Its queue keeps every waiting
  # run; the default replaces a waiting run, which would skip its release.
  release:
    if: github.event_name == 'push'
    concurrency:
      group: main-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # npm provenance names GITHUB_SHA as the source commit, and the signing
  # certificate binds the run's own commit, so a push run never publishes:
  # release-please can tag a merge that the run's commit does not hold. A
  # GITHUB_TOKEN workflow_dispatch starts a run, unlike its pushes, and the
  # run at the tag has the tagged commit as its github.sha.
  dispatch-publish:
    name: Dispatch the release publish
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # queue: max keeps every waiting dispatch; the default replaces a waiting
    # one, whose tagged release would then never publish.
    concurrency:
      group: main-dispatch-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Dispatch publish at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTPUTS: ${{ needs.release.outputs.release-outputs }}
        run: bun run --silent ci:dispatch-publish

  # queue: max keeps every waiting run; the default replaces a waiting run,
  # which would cancel a pending publish dispatch.
  publish:
    name: Publish the release
    needs: release-checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # npm does the publishing, not bun: trusted publishing (OIDC) needs
      # npm >= 11.5.1 — node 24 bundles at least 11.16 — and bun publish has
      # no OIDC support (oven-sh/bun#15601). Never upgrade the bundled npm in
      # place: a cross-major overlay prunes transitive deps that
      # libnpmpublish needs at publish time (sigstore).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ inputs.republish_paths }}
          RELEASED_VERSIONS: ${{ inputs.released_versions }}
        run: bun run --silent ci:publish-packages
